name: Build postmarketOS multi-board image

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PMB_WORK: /var/lib/msm8916-pmos/pmbootstrap-work
  PMB_APORTS: /var/lib/msm8916-pmos/pmaports
  PMB_EXPORT: /var/lib/msm8916-pmos/export
  PMBOOTSTRAP_REV: b2bf3539cd92acce4ab187167581168e845f3e7e
  PMAPORTS_REV: 1ce58c5ae1b7573c6471959c4ab406391eefb103

jobs:
  build:
    runs-on: [self-hosted, linux, x64, ubuntu-22.04, msm8916, docker]
    timeout-minutes: 360

    concurrency:
      group: msm8916-postmarketos-build
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          test "$(. /etc/os-release && echo "$VERSION_ID")" = "22.04"
          for command in \
            bash git patch shellcheck dtc debugfs mkfs.ext2 mkfs.btrfs \
            qemu-aarch64-static aarch64-linux-gnu-ld arm-none-eabi-gcc apt-get \
            python3 rsync tar unzip wget; do
            command -v "$command" >/dev/null || {
              echo "Missing required command: $command" >&2
              exit 1
            }
          done
          if ! python3 -c 'import tomli' 2>/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends python3-tomli
          fi
          python3 -c 'import cryptography'
          python3 -c 'import tomli'
          test "$(id -u)" -eq 0

      - name: Validate scripts and manifests
        run: |
          shellcheck scripts/*.sh
          for script in scripts/*.sh; do bash -n "$script"; done
          test "$(grep -cv '^#' config/boards.conf)" -eq 19
          test "$(grep -c '.dtb$' config/openstick-dtbs.list)" -eq 14

      - name: Clone pinned pmbootstrap and pmaports
        run: |
          if [ -d "$HOME/pmbootstrap/.git" ]; then
            echo "Reusing persistent pmbootstrap checkout at $HOME/pmbootstrap"
          else
            git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          fi
          git -C "$HOME/pmbootstrap" checkout "$PMBOOTSTRAP_REV"
          if [ -d "$PMB_APORTS/.git" ]; then
            echo "Reusing persistent pmaports checkout at $PMB_APORTS"
          else
            git clone --filter=blob:none https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMB_APORTS"
          fi
          git -C "$PMB_APORTS" checkout "$PMAPORTS_REV"
          mkdir -p "$HOME/.local/bin" "$HOME/.config"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add the 19-board kernel overlay
        run: |
          marker="$PMB_APORTS/.msm8916-multiboard-prepared"
          if [ -f "$marker" ]; then
            echo "Reusing previously prepared pmaports overlay"
          else
            scripts/prepare-pmaports.sh "$PMB_APORTS"
            date -u +%FT%TZ > "$marker"
          fi

      - name: Configure pmbootstrap
        run: |
          mkdir -p "$PMB_WORK"
          printf '8\n' > "$PMB_WORK/version"
          cat > "$HOME/.config/pmbootstrap_v3.cfg" <<EOF
          [pmbootstrap]
          aports = $PMB_APORTS
          boot_size = 512
          build_default_device_arch = True
          build_pkgs_on_install = True
          ccache_size = 5G
          device = zhihe-generic
          extra_packages = device-zhihe-generic-nonfree-firmware,soc-qcom-msm8916-rproc,qmi-utils,qrtr,modemmanager,iw,wpa_supplicant,wireless-regdb
          hostname = msm8916-pmos
          is_default_channel = False
          jobs = 4
          kernel = ufi001c
          locale = C.UTF-8
          ssh_keys = False
          sudo_timer = False
          timezone = Asia/Shanghai
          ui = console
          user = user
          work = $PMB_WORK

          [providers]

          [mirrors]
          EOF
          sed -i 's/^          //' "$HOME/.config/pmbootstrap_v3.cfg"
          pmbootstrap --version
          pmbootstrap config device
          pmbootstrap config kernel
          pmbootstrap config ui
          pmbootstrap config extra_packages

      - name: Checksum and build the patched kernel package
        run: |
          pmbootstrap checksum linux-postmarketos-qcom-msm8916
          pmbootstrap build --arch aarch64 --force linux-postmarketos-qcom-msm8916

      - name: Build split postmarketOS image
        run: |
          if ! pmbootstrap install --split --filesystem btrfs --password 147147; then
            pmbootstrap log || true
            exit 1
          fi
          pmbootstrap export

      - name: Upload pmbootstrap failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-failure-log
          path: ${{ env.PMB_WORK }}/log.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build bootloader artifacts
        run: |
          mkdir -p artifacts/bootloaders
          scripts/build-bootloaders.sh artifacts/bootloaders
          wget -q -O /tmp/db410c_fw.zip \
            'https://builds.96boards.org/dragonboard410c/linaro/rescue/17.09/dragonboard410c_bootloader_emmc_android-88.zip'
          unzip -o -j -d /tmp/db410c_fw /tmp/db410c_fw.zip 'tz.mbn'
          cp /tmp/db410c_fw/tz.mbn artifacts/bootloaders/tz.mbn

      - name: Configure and verify the multi-board boot image
        run: |
          mkdir -p artifacts/dtbs
          scripts/configure-multiboard-boot.sh \
            "$PMB_EXPORT/zhihe-generic-boot.img" artifacts/dtbs

      - name: Collect and verify release files
        run: |
          mkdir -p artifacts/export
          cp config/boards.conf artifacts/boards.conf
          cp "$HOME/.config/pmbootstrap_v3.cfg" artifacts/pmbootstrap_v3.cfg
          pmbootstrap status > artifacts/pmbootstrap-status.txt
          while IFS= read -r path; do
            rel="${path#$PMB_EXPORT/}"
            mkdir -p "artifacts/export/$(dirname "$rel")"
            cp -L "$path" "artifacts/export/$rel"
          done < <(find "$PMB_EXPORT" -xtype f | sort)
          {
            echo "root=$(git rev-parse HEAD)"
            echo "pmos-example=$(git -C pmos-example rev-parse HEAD)"
            echo "debian-dtbs=$(git -C debian-dtbs rev-parse HEAD)"
            echo "pmbootstrap=$PMBOOTSTRAP_REV"
            echo "pmaports=$PMAPORTS_REV"
          } > artifacts/source-versions.txt
          (
            cd artifacts
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          test "$(find artifacts/dtbs -maxdepth 1 -type f -name '*.dtb' | wc -l)" -eq 19
          tar -C artifacts -czf postmarketos-msm8916-multiboard.tar.gz .
          tar -tzf postmarketos-msm8916-multiboard.tar.gz | grep -Fq './export/zhihe-generic-boot.img'
          tar -tzf postmarketos-msm8916-multiboard.tar.gz | grep -Fq './export/zhihe-generic-root.img'

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-msm8916-multiboard
          path: postmarketos-msm8916-multiboard.tar.gz
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: multiboard-${{ github.run_number }}
          name: "postmarketOS MSM8916 multi-board #${{ github.run_number }}"
          body: |
            One split postmarketOS image containing all 19 supported MSM8916 DTBs.

            The default is `msm8916-thwc-ufi001c.dtb`. Mount the boot image and edit
            `/extlinux/extlinux.conf`, or edit `/boot/extlinux/extlinux.conf` after
            installation, to select another file listed in `boards.conf`.

            CI verifies DTB compilation/structure and image contents. Hardware boot
            and peripheral behavior remain board-owner validation tasks.
          files: postmarketos-msm8916-multiboard.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: true

      - name: Preserve failed build state
        if: ${{ failure() }}
        env:
          FAILURE_DIR: /var/lib/msm8916-pmos/failures/${{ github.run_id }}
        run: |
          mkdir -p "$FAILURE_DIR"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            date -u +%FT%TZ
          } > "$FAILURE_DIR/run-metadata.txt"
          git status --short > "$FAILURE_DIR/git-status.txt" || true
          git rev-parse HEAD > "$FAILURE_DIR/repository-revision.txt" || true
          pmbootstrap status > "$FAILURE_DIR/pmbootstrap-status.txt" || true
          cp -a "$HOME/.config/pmbootstrap_v3.cfg" "$FAILURE_DIR/" 2>/dev/null || true
          cp -a "$PMB_WORK/log.txt" "$FAILURE_DIR/" 2>/dev/null || true
          printf '%s\n' \
            "Original build state was intentionally retained:" \
            "  PMB_WORK=$PMB_WORK" \
            "  PMB_APORTS=$PMB_APORTS" \
            "  PMB_EXPORT=$PMB_EXPORT" \
            "  workspace=$GITHUB_WORKSPACE" > "$FAILURE_DIR/README.txt"

      - name: Upload failed build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: msm8916-failure-${{ github.run_id }}
          path: |
            /var/lib/msm8916-pmos/failures/${{ github.run_id }}
            ${{ env.PMB_WORK }}/log.txt
            artifacts
          if-no-files-found: warn
          retention-days: 30
