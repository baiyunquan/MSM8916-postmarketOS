name: Validate device trees

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_TAG: v6.12.1-msm8916
  PMAPORTS_REV: 1ce58c5ae1b7573c6471959c4ab406391eefb103

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            device-tree-compiler \
            flex \
            git \
            shellcheck

      - name: Validate repository scripts and manifests
        run: |
          shellcheck scripts/*.sh
          shellcheck config/rndis-gadget/usb-gadget-rndis
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in config/rndis-gadget/usb-gadget-rndis; do
            sh -n "$script"
          done
          grep -Fqx 'Wants=NetworkManager.service' \
            config/rndis-gadget/usb-gadget-rndis.service
          grep -Fqx 'ExecStart=/usr/sbin/usb-gadget-rndis start' \
            config/rndis-gadget/usb-gadget-rndis.service
          grep -Fqx 'WantedBy=multi-user.target' \
            config/rndis-gadget/usb-gadget-rndis.service
          grep -Fqx 'enable usb-gadget-rndis.service' \
            config/rndis-gadget/90-msm8916-rndis.preset
          test "$(grep -cv '^#' config/boards.conf)" -eq 19
          test "$(cut -d '|' -f1 config/boards.conf | grep -v '^#' | sort -u | wc -l)" -eq 19
          test "$(grep -c '.dtb$' config/openstick-dtbs.list)" -eq 14
          git diff --check

      - name: Verify pmaports overlay applies to the pinned revision
        run: |
          git clone --filter=blob:none https://gitlab.postmarketos.org/postmarketOS/pmaports.git /tmp/pmaports
          git -C /tmp/pmaports checkout "$PMAPORTS_REV"
          scripts/prepare-pmaports.sh /tmp/pmaports
          grep -Fq 'pkgrel=7' /tmp/pmaports/device/testing/linux-postmarketos-qcom-msm8916/APKBUILD
          test -f /tmp/pmaports/device/testing/postmarketos-msm8916-rndis-gadget/APKBUILD
          grep -Fq 'pkgname=postmarketos-msm8916-rndis-gadget' \
            /tmp/pmaports/device/testing/postmarketos-msm8916-rndis-gadget/APKBUILD
          ! grep -Fq 'openrc' /tmp/pmaports/device/testing/postmarketos-msm8916-rndis-gadget/APKBUILD
          test -f /tmp/pmaports/device/testing/postmarketos-msm8916-rndis-gadget/usb-gadget-rndis.service
          test -f /tmp/pmaports/device/testing/postmarketos-msm8916-rndis-gadget/90-msm8916-rndis.preset
          kernel_config=/tmp/pmaports/device/testing/linux-postmarketos-qcom-msm8916/config-postmarketos-qcom-msm8916.aarch64
          grep -Fqx 'CONFIG_USB_GADGET=y' "$kernel_config"
          grep -Fqx 'CONFIG_CONFIGFS_FS=y' "$kernel_config"
          grep -Fqx 'CONFIG_USB_CONFIGFS=m' "$kernel_config"
          grep -Fqx 'CONFIG_USB_CONFIGFS_RNDIS=y' "$kernel_config"

      - name: Compile and inspect all 19 DTBs
        run: |
          git clone --depth=1 --branch "$KERNEL_TAG" --single-branch \
            https://github.com/msm8916-mainline/linux.git /tmp/linux-msm8916
          scripts/validate-dtbs.sh /tmp/linux-msm8916 /tmp/validated-dtbs
          test "$(find /tmp/validated-dtbs -maxdepth 1 -type f -name '*.dtb' | wc -l)" -eq 19

      - name: Upload validated DTBs
        uses: actions/upload-artifact@v4
        with:
          name: validated-msm8916-dtbs
          path: /tmp/validated-dtbs/*.dtb
          retention-days: 14
